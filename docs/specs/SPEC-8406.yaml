spec:
  id: SPEC-8406
  product: PROD-f67b
  intentions:
    - INT-53c1
  expectations:
    - EXP-6d96
    - EXP-2825
    - EXP-e66a
    - EXP-71c6
  status: draft
  context:
    stack: Inherit PROD-f67b Markdown/YAML/JSON/Bash. Use existing private Node >=22.20.0 tooling and locked
      yaml 2.8.3 / skills 1.5.25 for maintainer verification only.
    patterns: Canonical portable procedures, declared complete generated bundles, thin Claude adapters,
      main-conversation orchestration and read-only optional drafting roles.
    conventions:
      - Preserve Apache plugin/code and CC BY-SA framework license domains.
      - Keep authoring separate from lifecycle readiness; every new artifact starts draft and ordinary
        human confirmation rules remain intact.
      - Resolve bundled resources relative to the loaded skill with absolute quoted paths, and artifact
        paths from the consuming project root.
      - Use the precise decisions in docs/plans/2026-09-12-portable-authoring-contract.md; author
        unresolved design decisions here before execution.
    existing_code_refs:
      - path: plugin/commands/define-intentions.md
        note: Existing selection, dispatch and compatibility behavior.
      - path: plugin/commands/define-expectations.md
        note: Existing selection, dispatch and compatibility behavior.
      - path: plugin/commands/define-outcomes.md
        note: Existing selection, dispatch and compatibility behavior.
      - path: plugin/commands/quick-spec.md
        note: Existing selection, dispatch and compatibility behavior.
      - path: plugin/commands/write-spec.md
        note: Existing selection, dispatch and compatibility behavior.
      - path: plugin/agents/intention-author.md
        note: Existing authoring rules, metadata and model assignment.
      - path: plugin/agents/expectation-author.md
        note: Existing authoring rules, metadata and model assignment.
      - path: plugin/agents/outcome-author.md
        note: Existing authoring rules, metadata and model assignment.
      - path: plugin/agents/quick-spec-author.md
        note: Existing authoring rules, metadata and model assignment.
      - path: plugin/agents/spec-author.md
        note: Existing authoring rules, metadata and model assignment.
      - path: plugin/workflows/interview.md
        note: Portable interaction and validate-before-save pattern.
      - path: plugin/references/pilot/spec-reference.md
        note: Existing portable schema/lifecycle resource to reuse without modifying its contract.
      - path: scripts/test-install.mjs
        note: Catalog-driven isolated installation probes.
    auth: Existing local CLI authentication only for explicitly invoked disposable evaluation. No credential,
      personal configuration, marketplace or release changes.
  expectations_detail:
    - id: EXP-6d96
      description: Stakeholders can author linked draft artifacts from independently installed workflow skills.
      validation: Each of five standalone authoring stages resolves internal IDs in descriptive filenames,
        loads Product context and produces only its requested draft artifact types with correct parent
        links and one resolved exploration lineage. No other stage skill, plugin-root variable, globally
        installed helper or consumer package dependency is required.
      edge_cases:
        - Empty or ambiguous selection and archived-only parent IDs request selection/recovery without
          creating files.
        - Mixed Product parents or conflicting explicit/inherited exploration lineage remain unresolved
          questions; no silently selected context or empty lineage fields.
    - id: EXP-2825
      description: Stakeholder confirmation remains meaningful in standalone and accelerated authoring.
      validation: The main conversation retains supplied facts and asks only for missing decisions. Every new
        Expectation has at least two explicitly confirmed edge cases before any YAML in its proposed
        batch is saved; rejecting an edge case below that minimum prompts for a replacement. Content
        confirmation never certifies human Spec peer review.
      edge_cases:
        - Already supplied explicit confirmation is reused without asking again; unconfirmed generated
          suggestions are not saved.
        - Rejections leaving one confirmed edge case prevent save and progression to another Expectation,
          including quick-spec and define-outcomes.
    - id: EXP-e66a
      description: Authoring preserves existing user work and produces safe, consistent YAML.
      validation: Validate the complete proposed batch with duplicate-key rejection, parent/link consistency,
        reserved IDs and baseline checks before writes. Only the explicitly owned parent expectations
        lists may change; preserve other bytes, comments and modes. Save new artifacts as draft and never
        fabricate passed gates or lifecycle approval.
      edge_cases:
        - Concurrent parent changes or duplicate YAML keys stop before project writes rather than
          overwriting or whole-file reformatting.
        - An interrupted multi-file save reports exact partial writes and IDs; recovery reconciles those
          files and does not automatically undo user edits or generate duplicate children.
    - id: EXP-71c6
      description: Maintainers can verify complete authoring bundles while preserving Claude aliases.
      validation: The catalog emits all five real bundles with complete resources; local individual install
        probes pass in both hosts and copy/symlink modes. Ten command/agent frontmatter blocks remain
        unchanged, adapter model policy stays host-specific, and real host outcomes are recorded
        separately from package tests.
      edge_cases:
        - Removing a copy source leaves every installed resource and helper usable in a project with
          spaces in its path.
        - Unavailable host capabilities/authentication or failed model sessions remain explicitly blocked
          or failed; default npm tests never invoke models or install globally.
  boundaries:
    - Do not begin bulk implementation until SPEC-b2e3 pilot acceptance is established in actual host
      evidence; this draft and assessment are authoring work only.
    - Do not change existing live or historical artifacts, framework schemas/lifecycle rules, templates,
      examples, helper implementations, plugin identity/version/hooks or personal installations.
    - Do not port technical/validation review, exploration, archival, Forge, the legacy router or native
      Codex packaging in this Spec.
    - Do not rename commands or agents or change existing frontmatter/model metadata. Host model policy
      belongs only in the Claude adapters; no guessed cross-vendor model equivalence.
    - Do not infer stakeholder edge-case confirmation or human peer review from silence, agent output or
      passing tests. Keep session-specific migration authorization out of shipped authoring workflows.
    - Do not push, publish, tag, update external marketplaces, add dependencies to consuming projects or
      write outside the implementation Deliverables. Authoring, plan tracking and lifecycle transitions
      are separate orchestration changes.
  deliverables:
    - plugin/workflows/define-intentions.md, define-expectations.md, define-outcomes.md, quick-spec.md
      and write-spec.md — complete portable entry points for five authoring stages.
    - plugin/references/authoring/ — canonical shared authoring procedure and portable
      Intention/Expectation templates derived from existing Apache plugin resources; reuse the existing
      pilot Spec reference without semantic changes.
    - plugin/skill-catalog.json and plugin/skills/idd-define-intentions/, idd-define-expectations/,
      idd-define-outcomes/, idd-quick-spec/ and idd-write-spec/ — complete generated bundles with all
      required resources and ID helper, retaining existing bundles.
    - plugin/commands/define-intentions.md, define-expectations.md, define-outcomes.md, quick-spec.md and
      write-spec.md; plugin/agents/intention-author.md, expectation-author.md, outcome-author.md,
      quick-spec-author.md and spec-author.md — ten thin compatible adapters.
    - scripts/lib/assembly.mjs, tests/assembly.test.mjs and tests/pilot.test.mjs — catalog
      state/inventory integration for eight implemented portable stages and seven planned stages without
      weakening existing validation.
    - scripts/test-install.mjs and tests/authoring.test.mjs — five individual bundle installation cases
      for both hosts/modes plus offline authoring fixture/oracle regressions.
    - scripts/evaluate-authoring.mjs, tests/helpers/authoring.mjs and tests/fixtures/authoring/ —
      optional bounded fresh-host evaluator and disposable exact-output/confirmation/refusal fixtures.
    - README.md, plugin/README.md and docs/contributing-agents.md — current stage inventory, local
      invocation/install and source ownership/evidence limitations.
    - docs/reviews/SPEC-8406-<UTC-timestamp>-execution.md and docs/reviews/SPEC-8406-host-evaluation.md —
      complete itemized execution and actual behavioral evidence with limitations.
  validation:
    automated:
      - Existing check/test suite passes on Node 22.20.0 and the current local Node runtime; two assembly
        builds are identical and all existing unowned bundles/frontmatter retain bytes and modes.
      - Individual installation probes verify five stages × two hosts × two modes, plus prior probes,
        including copy-source removal and no setup-time artifact creation.
      - Offline oracle tests reject invalid links/statuses, duplicate keys, insufficient/unconfirmed edge
        cases, unowned writes and parent reformatting; they distinguish package evidence from actual
        model outcomes.
      - Optional evaluator uses isolated projects, unchanged configured models, at most 600 seconds per
        host case and bounded output, with explicit failed/blocked outcomes and no personal settings
        writes.
      - Ownership/protected-file audit, introduced local links and git diff --check pass; execution
        report covers every edge case, Boundary, Deliverable and automated check after its own
        existence/nonempty verification.
    human_review:
      - Review actual fresh-host successful and refusal scenarios against stakeholder confirmation,
        inherited context, lineage and unchanged user edits; do not treat deterministic tests as semantic
        certification.
      - Review source/adapter behavior and migration decisions, including any retained Claude drafting
        delegation. Actual human peer review remains pending under the explicit unattended-session
        authorization.
      - Native interactive aliases and complete release certification remain later integration work;
        record what was and was not run.
  authoring_decisions:
    main_conversation: Selection, missing questions, confirmation and project writes stay in the main
      conversation. Optional role drafting receives explicit supplied context and returns proposals
      without project writes; orchestration validates and saves. Claude adapters retain Haiku for
      intention/expectation drafting and Sonnet for outcomes/quick-spec/spec drafting when delegation is
      used.
    draft_statuses: All new Intention/Expectation/Spec artifacts start draft. Completeness items 1–10 are
      separate from peer review; no authoring workflow emits passed gap evidence or promotes existing
      parent statuses.
    batch_save: Prepare and validate every candidate before the first project write. Reserve IDs across the
      candidate batch, recheck target absence and relevant parent content/modes, then save only owned
      paths. No atomic multi-file transaction is claimed. On failure preserve partial state and report
      exact written paths/IDs, remaining operations and required recovery. Parent expectation-list
      changes preserve all bytes outside that list; refuse if safe localized editing is unavailable.
    lineage: Explicit and inherited lineage must agree or be resolved by the stakeholder before saving.
      Propagate the selected EXPL ID to every new artifact, and omit the field when absent. Never
      silently recreate an archived parent.
    resources: Each bundle has its own SKILL.md, shared authoring procedure, required templates, Spec
      reference for Spec-producing modes, and scripts/idd-next-id with executable mode. Reuse existing
      safe YAML tooling or stop without writes; do not install a consumer parser.
    verification_design: Before this Spec may become ready, author exact scenario prompts, fixture expected
      artifacts, per-field mutation allowlists, partial-save/recovery behavior and mechanical oracle
      assertions. At minimum cover supplied-context successful authoring, missing confirmation, rejection
      below two edges, existing Expectations to Spec, cross-Product/lineage refusal and malformed-parent
      refusal. Do not improvise these acceptance contracts during implementation.
  execution_prerequisites:
    pilot: SPEC-b2e3 actual host pilot exit criterion, including the unresolved Claude cases, must pass
      before bulk conversion.
    readiness: "This draft is intentionally not ready: exact evaluation scenario oracles and independent
      gap-check are still required."
  peer_review:
    outcome: pending
    note: No actual review of this newly drafted contract is claimed.
  session_authorization:
    date: 2026-09-12
    scope: Continued local migration authoring under user unattended-work instruction.
    decision: Prepare the next focused contract while pilot evaluation continues. Do not bypass the pilot
      prerequisite or claim this draft ready.
  gap_check:
    status: blocked
    blockers: 1
    warnings: 0
    report: null
    date: 2026-09-12
