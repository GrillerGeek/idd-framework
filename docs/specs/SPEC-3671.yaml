  status: in-progress
  context:
    stack: Existing Node>=22.20.0 validation, Markdown/JSON plugin metadata and repository Git branch.
    patterns: Serialized local candidate preparation after verified native source checkpoint; exact
      metadata version changes plus evidence-based handoff, with unresolved upstream acceptance
      explicit.
    conventions:
      - Use framework minor1.7 and plugin1.7.0 according to contributor versioning, as the next
        local migration candidate after1.6.0.
      - Historical versions and failed evidence remain intact; actual publication requires a
        separate explicit action.
      - Human review remains pending under session authorization and is never inferred from machine
        evidence.
    existing_code_refs:
      - path: README.md
        note: Existing version and verification policy.
      - path: plugin/.claude-plugin/plugin.json
        note: Existing version and verification policy.
      - path: scripts/lib/packages.mjs
        note: Existing version and verification policy.
      - path: tests/fixtures/plugin-inventory.json
        note: Existing version and verification policy.
      - path: docs/contributing-agents.md
        note: Existing version and verification policy.
      - path: docs/reviews/2026-09-13-overnight-catch-up.md
        note: Existing version and verification policy.
    auth: Local source edits and local branch commits authorized; no remote write, tag, release,
      personal installation, model or marketplace mutation.
  expectations_detail:
    - id: EXP-eda3
      description: Maintainers can review a coherent local v1.7 release candidate with complete migration
        evidence and explicit publication steps.
      validation: Production framework badge and all three plugin manifests agree at
        framework1.7/plugin1.7.0; reviewed version baselines agree while all nonversion
        identities/frontmatters stay unchanged. Release notes and final catch-up report link actual
        accepted execution/distribution evidence and accurately separate local success, pending
        human review, hosted CI and remote publication. The branch is committed locally and no
        release action is performed.
      edge_cases:
        - Historical artifacts/reports/examples keep their original versions and conclusions;
          bumping current metadata never certifies an old failure or marks review artifacts done.
        - Unavailable native behavior, hosted CI, unpublished GitHub shorthand or human approval
          remains explicitly unverified; release notes contain no fabricated successful remote run,
          tag, marketplace update or merge.
  boundaries:
    - Do not implement until the SPEC-aa60 source checkpoint is committed with passing package
      checks, all individual test cases verified on both supported runtimes and both native
      lifecycle observations independently accepted. Only upstream Archive/Router acceptance and
      report/lifecycle closure may remain pending. Do not advance this Release Spec to review or
      call the candidate release-ready until SPEC-57b4, SPEC-ab84 and SPEC-aa60 have full required
      acceptance and committed closures.
    - Do not change any workflow/runtime/helper, command/agent metadata or body, schemas, historical
      artifacts/reports/templates/examples, dependency versions or personal settings. Current
      metadata version fields and their explicitly owned validator/fixture assertions may change,
      along with the explicitly owned README release prose, new release notes, current living
      catch-up report and this Execution Report. Other existing reports remain protected history.
    - Do not publish, push, tag, merge, create a public release, update any installed/remote
      marketplace or claim remote installation/hosted CI evidence.
    - Do not mark human review or lifecycle done from unattended implementation; preserve actual
      failed/limited trial records.
    - Do not write outside Deliverables. New authoring/gates/lifecycle and migration tracking are
      separately owned orchestration work.
  deliverables:
    - README.md badge/current release paragraph, plugin/plugin.json,
      plugin/.codex-plugin/plugin.json and plugin/.claude-plugin/plugin.json version fields only —
      coherent framework1.7/plugin1.7.0 local candidate with all nonversion metadata preserved.
    - scripts/lib/packages.mjs, tests/fixtures/plugin-inventory.json and only version-specific
      assertions/fixture metadata in tests/native-distribution.test.mjs,
      tests/helpers/native-distribution.mjs and tests/fixtures/native-distribution/ if present —
      align reviewed current-version validation without weakening nonversion identity/frontmatter
      checks or native behavior.
    - docs/releases/v1.7.md and docs/reviews/2026-09-13-overnight-catch-up.md — comprehensive
      results/decisions/remaining action report, accepted/failed evidence links,
      platform/model/install limits and explicit manual publication checklist. No claimed release
      event.
    - docs/reviews/SPEC-3671-<UTC>-execution.md — complete itemized version/preservation/test
      verification and pending human/remote follow-ups.
  validation:
    automated:
      - All prior tests/checks pass at minimum/current Node and individual installer checks remain
        valid for the final candidate; deterministic generated skills remain byte-identical to the
        verified native source checkpoint.
      - All three current manifest versions equal1.7.0, README framework badge equals1.7, reviewed
        inventory manifest agrees; nonversion metadata and all adapter frontmatter hashes equal the
        verified pre-bump source baseline. Existing historical versions remain unchanged.
      - Release/catch-up reports exist and are reread before passes; each success links actual
        evidence with its limits, pending hosted CI/publication/human review are explicit, final
        ownership/local links/git diff --check pass. Local branch commit exists; no
        actual-repository tag or remote ref mutation.
    human_review:
      - Review final installation choices, model/evidence limitations and release candidate; human
        approval remains pending.
      - Authorize and perform publication/hosted CI/GitHub shorthand testing separately when ready;
        these actions are not part of local release preparation.
  release_contract:
    version: Choose1.7.0 as the next migration candidate using the documented minor-release rule;
      preserve all manifest properties except version and matching reviewed version assertions. Do
      not add a Git tag or imply the published marketplace has changed. Existing version-specific
      source/test assertions introduced by native distribution are owned narrowly here; no behavior
      edits.
    evidence: "Report the entire approved migration: repository/contributor setup, source
      assembly/portable stages, guarded Claude checkpoint,
      authoring/review/Forge/Exploration/Archive, router and native distribution. Link their actual
      reports, list consequential autonomous decisions, retain failed runs and current
      Sonnet/native/remote limitations. Current docs may say candidate-ready only after their checks
      pass; report lifecycle review versus done honestly."
    publication: Manual next steps describe review, authorize push/PR, inspect hosted CI, verify install
      from published ref/default branch, then authorized release/tag/marketplace propagation.
      Provide no unverified published URLs or assumed remote success. Existing external
      GrillerGeek/skills marketplace is separate ownership and must not be edited. User personal
      installation remains their choice.
    integration: "Author scheduling decision: native packaging, direct native host evidence and
      individual current/minimum runtime test coverage may be checkpointed while upstream Archive
      remains unaccepted. Local version-only candidate preparation can proceed from this verified
      committed source; it does not imply any pending milestone is accepted or the candidate is
      ready to release. Preserve failed/sleep-interrupted full runs alongside passing targeted
      reruns, report test-case coverage distinctly from one uninterrupted full-suite result, and
      retain all upstream lifecycle gates. Final review/readiness requires all prior
      acceptance/closures; no push/tag/publication or personal install. A required earlier source
      change pauses/reconciles affected candidate integration. This performs the remaining
      reversible local implementation while waiting for an awake host, rather than removing the
      required Claude Archive observation."
  coverage_dispositions:
    - files:
        - AGENTS.md
        - CLAUDE.md
        - docs/framework.md
        - docs/artifacts.md
        - docs/contributing-agents.md
        - plugin/README.md
        - docs/installation.md
        - .agents/plugins/marketplace.json
        - .claude-plugin/marketplace.json
        - package.json
        - package-lock.json
