        - tests/helpers/archive-workflows.mjs
        - plugin/vendor/yaml/integrity.json
        - plugin/vendor/yaml/package.json
        - plugin/vendor/yaml/dist/compose/composer.js
        - plugin/vendor/yaml/dist/doc/Document.js
        - plugin/vendor/yaml/dist/doc/directives.js
        - plugin/LICENSE
        - docs/spec-authoring.md
        - tests/artifacts.test.mjs
        - tests/assembly.test.mjs
        - tests/fixtures/installed-execution/docs/specs/SPEC-c0de-greeting.yaml
      disposition: accept-omission
      reason: These version references describe host CLI/runtime/dependency versions, YAML language or
        archive/execution schemas, Apache licensing, generic stack guidance or unchanged validator
        APIs. They are independent of the production framework/plugin release version and must
        remain unchanged. No release validation depends on modifying them.
  migration_authorization:
    source: Repeated user approval and unattended best-judgment continuation.
    human_peer_review: pending
    scope: User-authorized unattended local candidate preparation after the verified committed Native
      source checkpoint described in Boundary1; no final review/readiness until upstream acceptance
      and closures. Human peer review remains pending.
