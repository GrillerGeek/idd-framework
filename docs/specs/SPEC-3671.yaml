        - plugin/workflows/
        - plugin/references/
        - plugin/skills/
        - plugin/runtime/
        - plugin/bin/
        - plugin/commands/
        - plugin/agents/
        - templates/
        - examples/
        - docs/plans/
        - docs/superpowers/
      disposition: accept-omission
      reason: Version-free installation/process guidance and marketplace identities remain valid; private
        tooling is not versioned as a consumer package. Canonical/generated behavior and historical
        evidence remain intact. New current release notes own candidate summary and manual
        publication steps; current migration tracking is separately owned.
    - files:
        - scripts/evaluate-exploration.mjs
        - scripts/evaluate-forge.mjs
        - scripts/evaluate-installed-execution.mjs
        - scripts/evaluate-pilot.mjs
        - scripts/evaluate-authoring.mjs
